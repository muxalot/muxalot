# One-shot repair for release run v0.2.3 (37364652637): its desktop-smoke jobs on
# ubuntu:24.04 and debian:12 were cancelled three times by GitHub's runner
# infrastructure (no logs, no failure), so desktop-publish never ran. This
# workflow re-runs the whole smoke matrix against the same artifacts from that
# run and then publishes exactly what it tested. Delete after use.
name: release-repair
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'The release run id whose artifacts to smoke and publish'
        required: true
      tag-name:
        description: 'Release to upload to (e.g. v0.2.3); a dispatch run has no tag of its own'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the desktop deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.run-id }}" --repo muxalot/muxalot -n desktop-deb -D deb && ls -la deb
      - name: Install and launch in ${{ matrix.image }}
        run: docker run --rm -v "$PWD/desktop/packaging/smoke.sh:/smoke.sh:ro" -v "$PWD/deb:/pkg:ro" "${{ matrix.image }}" bash /smoke.sh

  desktop-publish:
    needs: desktop-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the desktop deb and the Windows zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run-id }}" --repo muxalot/muxalot -n desktop-deb -D deb
          gh run download "${{ inputs.run-id }}" --repo muxalot/muxalot -n windows-zip -D win
          ls -la deb win
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            deb/muxalot-desktop_*.deb
            win/muxalot-desktop_*_windows-amd64.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd deb
          sha256sum muxalot-desktop_*.deb | tee SHA256SUMS-desktop
          gh release upload "${{ inputs.tag-name }}" muxalot-desktop_*.deb SHA256SUMS-desktop --clobber
          cd ../win
          sha256sum muxalot-desktop_*_windows-amd64.zip | tee SHA256SUMS-windows
          gh release upload "${{ inputs.tag-name }}" muxalot-desktop_*_windows-amd64.zip SHA256SUMS-windows --clobber