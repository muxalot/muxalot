name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
      - name: Build
        run: make agent
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/muxalot-agent-linux-*
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  # The desktop .deb is a follow-up: the agent job above creates the release, this adds to it.
  # A failure here never touches the agent assets; fix and re-run the failed jobs.
  desktop-build:
    runs-on: ubuntu-22.04 # oldest supported glibc (2.35): the binary then runs on Ubuntu 22.04+ and Debian 12+
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.deb.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/go.mod
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev fakeroot
      - name: Test
        run: make desktop-test
      - name: Build package
        run: make deb
      - name: Checksum
        id: deb
        run: echo "sha256=$(sha256sum dist/muxalot-desktop_*.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-deb
          path: dist/muxalot-desktop_*.deb
          if-no-files-found: error

  # Install the package and launch it on every supported distro; the supported list in the README is this matrix.
  desktop-smoke:
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-deb
          path: deb
      - name: Verify the artifact is the one that was built
        run: echo "${{ needs.desktop-build.outputs.sha256 }}  $(ls deb/*.deb)" | sha256sum -c -
      - name: Install and launch in ${{ matrix.image }}
        run: docker run --rm -v "$PWD/desktop/packaging/smoke.sh:/smoke.sh:ro" -v "$PWD/deb:/pkg:ro" "${{ matrix.image }}" bash /smoke.sh

  desktop-publish:
    needs: [agent, desktop-build, desktop-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-deb
          path: deb
      - name: Verify the artifact is the one that was tested
        run: echo "${{ needs.desktop-build.outputs.sha256 }}  $(ls deb/*.deb)" | sha256sum -c -
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: deb/muxalot-desktop_*.deb
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd deb
          sha256sum muxalot-desktop_*.deb > SHA256SUMS-desktop
          gh release upload "$GITHUB_REF_NAME" muxalot-desktop_*.deb SHA256SUMS-desktop --clobber
