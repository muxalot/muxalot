<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Muxalot">
  <!-- head -->
  <path d="M84 250 C84 110 160 30 256 30 C352 30 428 110 428 250 Q428 300 384 300 H128 Q84 300 84 250 Z" fill="#8B5CF6"/>
  <!-- eyes -->
  <circle cx="200" cy="112" r="27" fill="#fff"/><circle cx="312" cy="112" r="27" fill="#fff"/>
  <circle cx="206" cy="116" r="12" fill="#1E1B4B"/><circle cx="318" cy="116" r="12" fill="#1E1B4B"/>
  <!-- hanging legs (behind the terminal) -->
  <g fill="none" stroke="#8B5CF6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 320 C176 400 140 424 140 486"/>
    <path d="M336 320 C336 400 372 424 372 486"/>
    <path d="M232 330 C232 400 224 440 200 476"/>
    <path d="M280 330 C280 400 288 440 312 476"/>
  </g>
  <!-- terminal -->
  <rect x="128" y="158" width="256" height="182" rx="28" fill="#0B1512" stroke="#5B21B6" stroke-width="12"/>
  <path d="M170 210 L214 240 L170 270" fill="none" stroke="#2ECC9A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="242" y="258" width="56" height="20" rx="6" fill="#22D3EE"/>
  <!-- arms hugging the outside of the terminal, tips curling under it -->
  <g fill="none" stroke="#8B5CF6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 224 C64 264 62 336 100 372 C136 410 194 402 226 372"/>
    <path d="M412 224 C448 264 450 336 412 372 C376 410 318 402 286 372"/>
  </g>
  <!-- suckers -->
  <g fill="#DDD6FE">
    <circle cx="72" cy="300" r="7"/><circle cx="141" cy="395" r="7"/><circle cx="186" cy="394" r="7"/>
    <circle cx="440" cy="300" r="7"/><circle cx="371" cy="395" r="7"/><circle cx="326" cy="394" r="7"/>
  </g>
</svg>
